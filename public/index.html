<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EstuLanches</title>
<style>
  :root { --verde:#1f7a4d; --verde-esc:#14583a; --fundo:#f6f4ef; --card:#fff; --txt:#222; --cinza:#6b6b6b; --borda:#e3dfd6; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--fundo); color:var(--txt); }
  header { background:var(--verde); color:#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { margin:0; font-size:1.3rem; }
  #saude { font-size:.8rem; opacity:.9; }
  nav { display:flex; gap:4px; padding:10px 20px 0; }
  nav button { border:0; background:transparent; padding:10px 16px; font-size:1rem; cursor:pointer; border-bottom:3px solid transparent; color:var(--cinza); }
  nav button.ativo { color:var(--verde-esc); border-color:var(--verde); font-weight:600; }
  main { max-width:900px; margin:0 auto; padding:16px 20px 40px; }
  section { display:none; } section.ativo { display:block; }
  .grade { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--borda); border-radius:10px; padding:14px; }
  .card h3 { margin:0 0 4px; font-size:1.05rem; }
  .preco { color:var(--verde-esc); font-weight:700; }
  .indisp { opacity:.5; }
  button.btn { background:var(--verde); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; font-size:.95rem; }
  button.btn:hover { background:var(--verde-esc); }
  button.sec { background:#eee; color:var(--txt); }
  input, select { padding:8px 10px; border:1px solid var(--borda); border-radius:8px; font-size:1rem; }
  .linha { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0; }
  .carrinho li { display:flex; justify-content:space-between; padding:4px 0; }
  .msg { padding:8px 12px; border-radius:8px; margin:10px 0; display:none; }
  .msg.ok { display:block; background:#e2f3ea; color:var(--verde-esc); }
  .msg.erro { display:block; background:#fde7e7; color:#8a1f1f; }
  .tag { font-size:.75rem; background:#eee; border-radius:20px; padding:2px 10px; }
</style>
</head>
<body>
<header>
  <h1>🥪 EstuLanches</h1>
  <span id="saude">verificando…</span>
</header>
<nav>
  <button data-aba="cardapio" class="ativo">Cardápio</button>
  <button data-aba="pedidos">Pedidos</button>
  <button data-aba="admin">Gerenciar</button>
</nav>
<main>
  <div id="msg" class="msg"></div>

  <section id="cardapio" class="ativo">
    <div class="grade" id="grade"></div>
    <div class="card" style="margin-top:16px">
      <h3>Seu pedido</h3>
      <ul class="carrinho" id="carrinho" style="list-style:none;padding:0"></ul>
      <div class="linha"><strong>Total: <span id="total">R$ 0,00</span></strong></div>
      <div class="linha">
        <input id="cliente" placeholder="Seu nome" maxlength="60">
        <button class="btn" id="enviar">Fazer pedido</button>
        <button class="btn sec" id="limpar">Limpar</button>
      </div>
    </div>
  </section>

  <section id="pedidos">
    <div class="linha"><button class="btn sec" id="atualizar">Atualizar</button></div>
    <div class="grade" id="listaPedidos"></div>
  </section>

  <section id="admin">
    <div class="card">
      <h3>Novo item no cardápio</h3>
      <div class="linha">
        <input id="novoNome" placeholder="Nome" maxlength="60">
        <input id="novoPreco" placeholder="Preço (ex: 5,50)" size="12">
        <button class="btn" id="addItem">Adicionar</button>
      </div>
    </div>
    <h3>Disponibilidade</h3>
    <div class="grade" id="gradeAdmin"></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const brl = (c) => (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
let itens = [], carrinho = {};

function aviso(texto, tipo = 'ok') {
  const m = $('#msg'); m.textContent = texto; m.className = 'msg ' + tipo;
  setTimeout(() => (m.className = 'msg'), 4000);
}
async function api(url, opts) {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const dados = await r.json();
  if (!r.ok) throw new Error((dados.erros || ['erro']).join('; '));
  return dados;
}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

document.querySelectorAll('nav button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('nav button, section').forEach((e) => e.classList.remove('ativo'));
  b.classList.add('ativo'); $('#' + b.dataset.aba).classList.add('ativo');
  if (b.dataset.aba === 'pedidos') carregarPedidos();
});

async function saude() {
  try { const h = await api('/health'); $('#saude').textContent = '● online · banco ' + h.banco; }
  catch { $('#saude').textContent = '● offline'; }
}

async function carregarItens() {
  itens = await api('/api/itens');
  $('#grade').innerHTML = itens.map((i) => `
    <div class="card ${i.disponivel ? '' : 'indisp'}">
      <h3>${esc(i.nome)}</h3><div class="preco">${brl(i.preco_centavos)}</div>
      <div class="linha"><button class="btn" data-add="${i.id}" ${i.disponivel ? '' : 'disabled'}>
        ${i.disponivel ? 'Adicionar' : 'Indisponível'}</button></div>
    </div>`).join('');
  $('#gradeAdmin').innerHTML = itens.map((i) => `
    <div class="card"><h3>${esc(i.nome)}</h3><div class="preco">${brl(i.preco_centavos)}</div>
      <div class="linha"><button class="btn sec" data-toggle="${i.id}">
        ${i.disponivel ? 'Marcar indisponível' : 'Marcar disponível'}</button></div></div>`).join('');
}

function desenharCarrinho() {
  const ids = Object.keys(carrinho);
  let total = 0;
  $('#carrinho').innerHTML = ids.length ? ids.map((id) => {
    const i = itens.find((x) => x.id == id); total += i.preco_centavos * carrinho[id];
    return `<li><span>${carrinho[id]}× ${esc(i.nome)}</span><span>${brl(i.preco_centavos * carrinho[id])}
      <button class="btn sec" data-rem="${id}">−</button></span></li>`;
  }).join('') : '<li style="color:var(--cinza)">Nenhum item ainda.</li>';
  $('#total').textContent = brl(total);
}

async function carregarPedidos() {
  const ps = await api('/api/pedidos');
  $('#listaPedidos').innerHTML = ps.length ? ps.map((p) => `
    <div class="card"><h3>#${p.id} · ${esc(p.cliente)}</h3>
      <div>${p.itens.map((i) => `${i.quantidade}× ${esc(i.nome)}`).join('<br>')}</div>
      <div class="preco" style="margin:6px 0">${brl(p.total_centavos)}</div>
      <select data-status="${p.id}">${['recebido','preparando','pronto','entregue','cancelado']
        .map((s) => `<option ${s === p.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
    </div>`).join('') : '<p>Nenhum pedido ainda.</p>';
}

document.addEventListener('click', async (e) => {
  try {
    const t = e.target;
    if (t.dataset.add) { carrinho[t.dataset.add] = (carrinho[t.dataset.add] || 0) + 1; desenharCarrinho(); }
    if (t.dataset.rem) { if (--carrinho[t.dataset.rem] <= 0) delete carrinho[t.dataset.rem]; desenharCarrinho(); }
    if (t.dataset.toggle) {
      const i = itens.find((x) => x.id == t.dataset.toggle);
      await api('/api/itens/' + i.id, { method: 'PATCH', body: JSON.stringify({ disponivel: !i.disponivel }) });
      await carregarItens();
    }
  } catch (err) { aviso(err.message, 'erro'); }
});
document.addEventListener('change', async (e) => {
  if (e.target.dataset.status) {
    try { await api('/api/pedidos/' + e.target.dataset.status, { method: 'PATCH', body: JSON.stringify({ status: e.target.value }) }); aviso('Status atualizado'); }
    catch (err) { aviso(err.message, 'erro'); }
  }
});
$('#limpar').onclick = () => { carrinho = {}; desenharCarrinho(); };
$('#atualizar').onclick = carregarPedidos;
$('#enviar').onclick = async () => {
  try {
    const linhas = Object.entries(carrinho).map(([id, quantidade]) => ({ id: Number(id), quantidade }));
    const p = await api('/api/pedidos', { method: 'POST', body: JSON.stringify({ cliente: $('#cliente').value, itens: linhas }) });
    aviso(`Pedido #${p.id} enviado! Total ${brl(p.total_centavos)}`);
    carrinho = {}; $('#cliente').value = ''; desenharCarrinho();
  } catch (err) { aviso(err.message, 'erro'); }
};
$('#addItem').onclick = async () => {
  try {
    const preco = Math.round(parseFloat($('#novoPreco').value.replace(',', '.')) * 100);
    await api('/api/itens', { method: 'POST', body: JSON.stringify({ nome: $('#novoNome').value, preco_centavos: preco }) });
    $('#novoNome').value = ''; $('#novoPreco').value = ''; aviso('Item adicionado'); await carregarItens();
  } catch (err) { aviso(err.message, 'erro'); }
};

saude(); carregarItens().then(desenharCarrinho); setInterval(saude, 15000);
</script>
</body>
</html>
